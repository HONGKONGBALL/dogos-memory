<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>大头 · 陪伴实验室</title>
<style>body{font:16px system-ui;background:#f3f2ed;color:#23382d;max-width:950px;margin:40px auto;padding:0 24px}h1{font-size:36px}section{background:white;border-radius:20px;padding:24px;margin:20px 0}button{background:#245740;color:white;border:0;border-radius:10px;padding:12px 18px;margin:5px;cursor:pointer}button.secondary{background:#e9eee9;color:#234}label{display:inline-block;margin:12px}input[type=number]{width:65px}#state{font-size:30px;font-weight:700}#mode{font-weight:700;color:#94621c}li{margin:12px 0;overflow-wrap:anywhere}small{color:#58685f}#error{color:#a32b20}</style>
<h1>大头 · 陪伴实验室</h1><p>主动关注，也懂得安静陪伴。</p><p id="mode">读取运行模式…</p>
<section><div id="state">—</div><p id="reason"></p><small id="memory"></small><p><button onclick="send('start')">启动陪伴</button><button class="secondary" onclick="send('pause')">暂停自主行为</button><button class="secondary" onclick="send('reset_fault')">确认故障</button></p><small>暂停会清除待执行行为；已发出的有限请求完成后确认暂停；灯光最多 1.5 秒，头部由机载定时回正。此按钮不是整机急停。</small></section>
<section><h2>环境输入</h2><p>模拟模式可提交场景；实机模式直接接收电池、充电、人物检测和触摸话题。</p>
<label><input id="present" type="checkbox" checked> 有人在场</label><label><input id="busy" type="checkbox"> 对方在忙</label><label><input id="charging" type="checkbox"> 正在充电</label><label>电量 <input id="battery" type="number" min="0" max="100" value="80"> %</label>
<p><button onclick="observe()">提交场景</button><button onclick="send('respond')">模拟回应 / 抚摸</button></p><label><input id="repeat" type="checkbox" checked> 模拟模式每 5 秒续报当前场景</label><p id="fresh"></p></section>
<section><h2>真实输入状态</h2><pre id="sensors" style="white-space:pre-wrap"></pre><p><a href="/api/capabilities" target="_blank">查看全部能力接入清单</a></p></section><section><h2>行为记录</h2><p>模拟执行、原生服务确认和实物效果分别记录；服务确认不代表现场效果已验证。</p><div id="error"></div><ul id="events"></ul></section>
<script>
let mode='unknown'; const names={paused:'已暂停',quiet:'安静陪伴',inviting:'等待你的回应',interacting:'正在互动',fault:'执行故障，已暂停'};
async function send(kind,data={}){try{const r=await fetch('/api/event',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({kind,data})});const v=await r.json();if(!r.ok)throw Error(v.error);document.getElementById('error').textContent='';await refresh()}catch(e){document.getElementById('error').textContent=e.message}}
function observe(){return send('observation',{present:document.getElementById('present').checked,busy:document.getElementById('busy').checked,charging:document.getElementById('charging').checked,battery:Number(document.getElementById('battery').value)})}
async function refresh(){try{const r=await fetch('/api/state');if(!r.ok)throw Error('状态读取失败');const s=await r.json();mode=s.mode;document.getElementById('mode').textContent=mode==='simulation'?'本机模拟 · 没有连接机械狗':'实机陪伴 · 原生感知输入';document.getElementById('state').textContent=names[s.state];document.getElementById('reason').textContent=s.reason;document.getElementById('memory').textContent=`累计回应 ${s.interactions} 次 · 连续忽略 ${s.ignored} 次`;document.getElementById('fresh').textContent=s.fresh?'环境输入有效':'环境输入已过期或尚未提交；自主行为保持安静';document.getElementById('repeat').disabled=mode!=='simulation';document.getElementById('sensors').textContent=s.sensors?JSON.stringify(s.sensors,null,2):'模拟输入';for(const el of document.querySelectorAll('section:nth-of-type(2) button,section:nth-of-type(2) input'))el.disabled=mode!=='simulation';const list=document.getElementById('events');list.replaceChildren();for(const e of s.events){const li=document.createElement('li');li.textContent=e.time+' · '+e.kind+' · '+(typeof e.detail==='string'?e.detail:JSON.stringify(e.detail));list.append(li)}}catch(e){document.getElementById('mode').textContent='服务连接已断开，当前状态未知';mode='unknown'}}
setInterval(refresh,1000);setInterval(()=>{if(mode==='simulation'&&document.getElementById('repeat').checked)observe()},5000);refresh();
</script></html>
